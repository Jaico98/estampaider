spring.application.name=estampaider-backend
app.bootstrap-admin.enabled=${ADMIN_BOOTSTRAP_ENABLED:false}
app.bootstrap-admin.username=${ADMIN_BOOTSTRAP_USERNAME:}
app.bootstrap-admin.password=${ADMIN_BOOTSTRAP_PASSWORD:}
app.bootstrap-admin.email=${ADMIN_BOOTSTRAP_EMAIL:}
app.bootstrap-admin.phone=${ADMIN_BOOTSTRAP_PHONE:}
app.release-version=${APP_RELEASE_VERSION:1.0.0}

# Perfil activo
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# Seguridad
logging.level.org.springframework.security=INFO
app.jwt.secret=${JWT_SECRET:}
jwt.expiration=${JWT_EXPIRATION:14400000}

# CORS
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5501,http://127.0.0.1:5501,http://localhost:3000,http://127.0.0.1:3000,https://jaico98.github.io,https://estampaider.com,https://www.estampaider.com}

# Cloudinary
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}
